<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regradient</title>
  </head>
  <body>
    <section class="appShell">
      <div class="titlebar" data-tauri-drag-region>
        <h1 class="header" data-tauri-drag-region>
          <span class="accentDot"></span>
          Regradient
        </h1>
        <div class="titleButtons">
          <button class="iconButton" id="minimizeBtn" title="Minimize">&#x2013;</button>
          <button class="iconButton" id="closeBtn" title="Close">
            <img src="/close.svg" width="14" height="14" alt="" />
          </button>
        </div>
      </div>

      <div class="mainGrid">
        <div class="leftColumn">
          <div class="workArea">
            <div class="photoStripCol">
              <div class="photoStripHead">
                <p class="panelLabel">Photos</p>
                <button class="button compact" id="addPhotoBtn" title="Add photos">+</button>
              </div>
              <div class="photoStrip scrollY" id="photoStrip"></div>
            </div>

            <div class="photoMain">
              <p class="panelLabel">Photo</p>
              <div class="dropzone" id="dropzone" tabindex="0">
                <div class="dropzoneEmpty" id="dropzoneEmpty">
                  <p>Drop photos here</p>
                  <p class="hint">
                    or press <span class="hintKey">Ctrl</span>+<span class="hintKey">V</span> to paste from the
                    clipboard, or pick files from disk
                  </p>
                  <button class="button compact" id="browseImageBtn">Choose files…</button>
                </div>
                <div class="previewStage" id="previewStage" style="display: none">
                  <canvas id="previewCanvas"></canvas>
                </div>
                <span class="previewMeta" id="previewMeta" style="display: none"></span>
                <button
                  class="button compact clearImage"
                  id="clearImageBtn"
                  style="display: none"
                  title="Remove this photo"
                >
                  ✕
                </button>
              </div>
            </div>
          </div>

          <div class="exportBar">
            <p class="panelLabel">Export</p>
            <div class="pathRow">
              <input type="text" class="textInput" id="exportPath" placeholder="Export folder…" />
              <button class="button compact" id="browsePathBtn">…</button>
            </div>

            <div class="checkRow">
              <label class="checkboxWrapper">
                <input type="checkbox" id="wrapInGradientedImages" />
                <span class="checkmark"></span>
                <span>Create a "Gradiented Images" folder</span>
              </label>
              <label class="checkboxWrapper">
                <input type="checkbox" id="perGradientFolders" />
                <span class="checkmark"></span>
                <span>Separate folder per gradient</span>
              </label>
              <label class="checkboxWrapper">
                <input type="checkbox" id="exportDefault" />
                <span class="checkmark"></span>
                <span>Also export the original (_default)</span>
              </label>
            </div>

            <div class="exportFooter">
              <span class="status" id="exportStatus"></span>
              <button class="button primary" id="exportBtn" disabled>Export</button>
            </div>
          </div>
        </div>

        <div class="rightColumn">
          <div class="gradientListHead">
            <p class="panelLabel">Gradients</p>
            <span class="count" id="gradientCount"></span>
          </div>
          <div class="searchRow">
            <input type="text" class="textInput" id="gradientSearch" placeholder="Search by name…" />
            <button class="button compact" id="newGradientBtn">+ New</button>
          </div>
          <div class="gradientList scrollY" id="gradientList"></div>
        </div>

        <!-- Gradient editor, filled in by editor.ts. Scoped to mainGrid (not
             appShell) so it can never cover the titlebar's drag region. -->
        <div class="editorOverlay" id="editorOverlay"></div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
